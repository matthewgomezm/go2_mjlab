[project]
name = "unitree-vision-rl"
version = "0.1.0"
description = "Unitree Go2 Vision RL in mjlab"
readme = "README.md"
authors = [
    { name = "Matthew Gomez", email = "matthewgomezm10@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mjlab>=1.6.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.30.0",
    "torch",
    "torchvision",
    "wandb>=0.22.3,<0.29",
]

# PyPI's torch is the CUDA 13 build, which needs NVIDIA driver >= 580. The CUDA 12.9 build runs on
# driver >= 525 (Blackwell >= 570), so the same lock works on nearly any cloud GPU image.
[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[project.scripts]
unitree-vision-rl = "unitree_vision_rl:main"

[project.entry-points."mjlab.tasks"]
unitree_vision_rl = "unitree_vision_rl"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
