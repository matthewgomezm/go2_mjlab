name: Lint

on:
  push:
    branches: [main]
  pull_request:

env:
  RUFF_VERSION: "0.17.0"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      # Keep RUFF_VERSION in sync with `rev` in .pre-commit-config.yaml.
      - name: Check formatting
        run: uv format --version ${{ env.RUFF_VERSION }} --check --diff
      - name: Lint
        run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github
